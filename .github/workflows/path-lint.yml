# Guards the deployment-path invariant: a second deployment path can only be
# introduced through a pathtabs shortcode carrying relearn's `groupid`, never as a
# bare `tabs` group that silently resets to its first tab on every page load.
#
# This repo has one path today (self-managed kubeadm), so the linter's path
# vocabulary is empty and only its repo-agnostic checks are live — see the docstring
# in scripts/lint_paths.py. ai-101 is the reference implementation.
#
# Separate from static.yml on purpose — that file is in the repo template's
# FILES_TO_COPY, so anything added there is reverted by the next template upgrade.
name: Path lint

on:
  pull_request:
    paths:
      - "content/**"
      - "layouts/shortcodes/pathtab*.html"
      - "scripts/lint_paths.py"
      - ".github/workflows/path-lint.yml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint deployment paths
        run: python3 scripts/lint_paths.py
